
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Muslim-Android-Project-Updated.zip -d . -x '.github/workflows/*'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate audio list
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('www/audio/list.json',JSON.stringify(fs.readdirSync('www/audio').map(f=>(f.match(/hisn-exact-(\\d+)\\.mp3$/)||[])[1]).filter(Boolean).map(Number)))"

      - name: Install dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Install app and notification icons
        run: |
          cp -r resources/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp resources/notification-icon.png android/app/src/main/res/drawable-nodpi/ic_stat_muslim.png
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' android/app/src/main/AndroidManifest.xml

      - name: Configure Android permissions and sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp resources/*.mp3 android/app/src/main/res/raw/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.WAKE_LOCK"/><application|' "$M"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
